[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["C408", "BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = true

