version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["Ad1xon"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 3
    assignees: ["Ad1xon"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3
    assignees: ["Ad1xon"]

  - package-ecosystem: terraform
    directories: [/infra/terraform, /infra/github]
    schedule:
      interval: weekly
    groups:
      terraform-deps:
        patterns: ["*"]
    open-pull-requests-limit: 3
    assignees: ["Ad1xon"]
