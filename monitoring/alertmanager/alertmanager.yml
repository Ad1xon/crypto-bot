# Routes alerts to Discord. The webhook URL is read from a Docker secret so it never lands in git.
#   echo "https://discord.com/api/webhooks/..." > secrets/discord_webhook_url

route:
  receiver: discord
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: discord
      group_wait: 10s
      repeat_interval: 30m

inhibit_rules:
  # If the bot is down, don't also fire "market data stale" for the same outage.
  - source_matchers: ['alertname="BotDown"']
    target_matchers: ['alertname="MarketDataStale"']
  - source_matchers: ['alertname="GexCollectorDown"']
    target_matchers: ['alertname=~"GexSnapshotStale|GexFetchErrors"']

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts }}**{{ .Labels.severity | toUpper }}** - {{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}
          {{ end }}Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
