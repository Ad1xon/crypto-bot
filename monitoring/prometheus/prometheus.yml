global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: crypto-quant

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: crypto-quant-bot
    static_configs:
      - targets: ["bot:9100"]
        labels:
          component: bot

  - job_name: crypto-quant-gex
    static_configs:
      - targets: ["gex-collector:9101"]
        labels:
          component: gex-collector

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
